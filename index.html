<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=./simulador_vista_ponta_negra.html">
    <title>Simulador Vista Ponta Negra - Redirecionando...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            max-width: 400px;
            padding: 40px;
        }
        h1 {
            color: #38bdf8;
            font-size: 1.5rem;
            margin-bottom: 20px;
        }
        p {
            color: #cbd5e1;
            margin-bottom: 20px;
        }
        a {
            color: #38bdf8;
            text-decoration: none;
            font-weight: 600;
        }
        a:hover {
            text-decoration: underline;
        }
        .loader {
            border: 4px solid #334155;
            border-top: 4px solid #38bdf8;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏢 Vista Ponta Negra - Torre Maré</h1>
        <div class="loader"></div>
        <p>Redirecionando para o simulador...</p>
        <p><a href="./simulador_vista_ponta_negra.html">Clique aqui se não for redirecionado automaticamente</a></p>
    </div>
</body>
</html>
